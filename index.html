<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Gautam Parihar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="../../index.html#projects" class="back-link">&larr; Back to Portfolio</a>

  <div class="app-card todo">
    <h2 class="app-title">To-Do List</h2>

    <!-- Add task form -->
    <form id="taskForm" class="input-group mb-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." maxlength="80" autocomplete="off">
      <button class="btn btn-add" type="submit"><i class="bi bi-plus-lg"></i> Add</button>
    </form>

    <!-- Counter -->
    <p id="counter" class="counter">No tasks yet</p>

    <!-- Task list -->
    <ul id="taskList" class="task-list"></ul>

    <button id="clearDone" class="btn btn-sm btn-clear">Clear completed</button>
  </div>

  <p class="page-footer">
    Source code on <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
  </p>

  <script src="script.js"></script>
</body>

</html>
